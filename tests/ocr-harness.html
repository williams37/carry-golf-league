<!doctype html><html><body><canvas id="dbg"></canvas>
<script type="module">
import { loadImage, scanScorecard } from '/src/lib/ocr.js';
window.runScan = async (url, opts = {}) => {
  const blob = await (await fetch(url)).blob();
  const img = await loadImage(blob);
  const r = await scanScorecard(img, opts);
  if (r.preview) { window.lastPreview = r.preview.toDataURL('image/png'); }
  return { players: r.players, par: r.par, method: r.method, ms: r.ms, quality: r.quality, debug: r.debug };
};
window.ready = true;
</script></body></html>
